# Process stages mapped onto each project's Jira workflow.
process_version: 0.1.0

stages: [backlog, estimate, development, code_review, dev_signoff,
         testing, test_review, test_signoff, done]

# "Started" is the first entry into start_stage or any later stage before done.
start_stage: development
done_stage: done

projects:
  AIL:
    name: AILED
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "DISCUSSION REQUIRED": development
      "READY FOR TESTING": development
      "IN TESTING": development
      "READY TO RELEASE": development
      "Done": done
    estimate:
      basis: points
      field: story_points      # "Story point estimate", customfield_10016 (see fields.yaml)
      hours_per_point: 8
    evidence:
      code_review: null
      dev_signoff: null
      testing: null
      test_review: null
      test_signoff: null
    # Whom tickets count for, until an admin changes it on the People page: AILED leaves Programmer empty.
    credit: {source: assignee}

  LEADRSC:
    name: LEADRS CORE
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "CODE REVIEW": code_review
      "QA": testing
      "QA Review": test_review
      "Ready to Deploy": code_review
      "Done": done
    estimate: {basis: points, field: story_points, hours_per_point: 8}
    evidence:
      code_review: {status: "CODE REVIEW"}
      dev_signoff: null
      testing: {status: "QA"}
      test_review: {status: "QA Review"}
      test_signoff: null

  LEADRSCOMS:
    name: LEADRS COMS
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "Code Review": code_review
      "QA": testing
      "QA Review": test_review
      "READY TO DEPLOY": code_review
      "Done": done
    estimate: {basis: points, field: story_points, hours_per_point: 8}
    evidence:
      code_review: {status: "Code Review"}
      dev_signoff: null
      testing: {status: "QA"}
      test_review: {status: "QA Review"}
      test_signoff: null

  LEADRSDRE:
    name: LEADRS DRE
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "Code Review": code_review
      "QA": testing
      "QA Review": test_review
      "Ready To Deploy": code_review
      "Done": done
      # Retired statuses, in the history only (last used July 2025).
      "Bench": backlog
      "Postponed": backlog
      "Review": code_review
    estimate: {basis: points, field: story_points, hours_per_point: 8}
    evidence:
      code_review: {status: "Code Review"}
      dev_signoff: null
      testing: {status: "QA"}
      test_review: {status: "QA Review"}
      test_signoff: null

  MJHDASH:
    name: MJH DASHBOARD
    status_to_stage:
      "To Do": backlog
      "Dev Queue": backlog
      "DISCUSSION REQUIRED": backlog
      "In Progress": development
      "Code Review": code_review
      "In Testing": testing
      "Test Review": test_review
      "Done": done
      "IN BENCH": backlog
      "UNRESOLVED ISSUE": development
      "READY FOR TESTNG": development
    estimate: {basis: points, field: story_points, hours_per_point: 8}
    evidence:
      code_review: {status: "Code Review"}
      dev_signoff: null
      testing: {status: "In Testing"}
      test_review: {status: "Test Review"}
      test_signoff: null
    # The workflow clears the assignee at every hand-off, so tickets count for their Programmer.
    credit: {source: field, field: programmer}

  DEMO:
    synthetic: true
    name: Demo project
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "Done": done
    estimate:
      basis: points
      field: story_points
      hours_per_point: 8
    evidence:
      code_review: null
      dev_signoff: null
      testing: null
      test_review: null
      test_signoff: null
