[pytest]
testpaths = tests
pythonpath = .
# Live tests talk to a real service (the Jira site or the Anthropic API); they are opt-in via `pytest -m live`.
addopts = -m "not live" -p no:cacheprovider
markers =
    live: talks to a real service (Jira or the Anthropic API); opt-in via `pytest -m live`, credentials from the environment
    slow: performance checks on synthetic data
