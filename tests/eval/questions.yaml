# Q&A eval set: ground truth from DEMO, seed 20261104, 1,150 issues, now 2026-11-04T12:00:00Z.
dataset:
  project: DEMO
  seed: 20261104
  issues: 1150
  now: "2026-11-04T12:00:00Z"

