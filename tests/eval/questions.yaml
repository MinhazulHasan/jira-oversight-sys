# The Q&A eval set (Planning.md section 8, ticket 15): 30 team-level questions,
# run by `python -m oversight eval` and tests/test_eval.py through ask().
#
# Ground truth: project DEMO, the default demo seeded with seed 20261104 and
# 1,150 issues at now = 2026-11-04T12:00:00Z (DEMO_NOW in tests/test_eval.py),
# then derived and rules-run at that same time with tests/fixtures/config.
# - expected_calls: the plan oversight.ask.router.route makes for the question.
# - expected_numbers / expected_keys: computed in code, never by a model, from
#   the rows oversight.ask.catalog.run_query returns for that plan on that data,
#   written the way the scripted answer writes numbers (integers as is, floats
#   as is up to two decimals else to one decimal, shares as whole percentages).
#   Only values the answer states are listed; a findings list capped at its row
#   limit is checked by its keys, since its length is not the open count.
# - Outcomes: answered; not_understood for a per-person and an off-topic
#   question; not_measurable where DEMO records no code-review evidence;
#   no_data for a valid question that matches no rows.
# Recompute the values whenever the demo seed, the router or the catalogue changes.
#
# `dataset` records that ground truth as data: `python -m oversight eval` rebuilds
# it in a throwaway in-memory store (seed, derive and rules at `now`) and asks every
# question at `now`, so the eval never depends on the snapshot or the real clock.
dataset:
  project: DEMO
  seed: 20261104
  issues: 1150
  now: "2026-11-04T12:00:00Z"

cases:

# q01: oversight_count_issues(state=in_progress): the board's work in progress, Epics left out, as the Overview and
#   the Portfolio count it; the count and the first three sample keys.
- id: q01
  question: "How many tickets are in progress?"
  expected_calls: ["oversight_count_issues"]
  expected_outcome: answered
  expected_numbers: ["115"]
  expected_keys: ["DEMO-1115", "DEMO-1114", "DEMO-1106"]

