# James's agreed process, mapped onto each project's Jira workflow.
# `python -m oversight doctor` checks that every status maps to a stage.
process_version: 0.1.0-test

stages: [backlog, estimate, development, code_review, dev_signoff,
         testing, test_review, test_signoff, done]

# "Started" is the first entry into start_stage or any later stage before done.
start_stage: development
done_stage: done

projects:
  AIL:
    # Team-managed project ("AILED"). Its workflow has only these three statuses:
    # on 4 Nov 2026, 0 of 1,146 issues were in any other status.
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "Done": done
    estimate:
      basis: points            # AIL has no original estimates (0 of 291 resolved in the 90 days to 2 Nov)
      field: story_points      # "Story point estimate", customfield_10016 (see fields.yaml)
      hours_per_point: 8       # to agree with James (open question 3)
    evidence:
      # null: rules that need this evidence report "not measurable" (Phase 3).
      # Candidates checked on 4 Nov 2026 (read-only JQL counts over 1,146 issues):
      #   Code Reviewers (customfield_10139), Testers (customfield_10140) and
      #   Test Reviewers (customfield_10141) exist but are empty on every issue;
      #   Programmer (customfield_10138) is set on 10. No pull requests are linked
      #   (development[pullrequests].all > 0 matches 0 issues). 820 issues have
      #   issue links; the baseline report breaks them down by link type.
      code_review: null
      dev_signoff: null
      testing: null
      test_review: null
      test_signoff: null

  DEMO:
    # Synthetic project written by `python -m oversight demo`: the same
    # three-status workflow as AIL, so the whole pipeline runs without Jira.
    # synthetic: its issues don't exist on the Jira site, so nothing links there.
    synthetic: true
    name: Demo project
    status_to_stage:
      "To Do": backlog
      "In Progress": development
      "Done": done
    estimate:
      basis: points
      field: story_points
      hours_per_point: 8
    evidence:
      code_review: null
      dev_signoff: null
      testing: null
      test_review: null
      test_signoff: null
