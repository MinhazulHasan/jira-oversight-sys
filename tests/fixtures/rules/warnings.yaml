# History-based early warnings: W-AGE-01 (in the current status longer than
# the project's p90 for that status) and W-REV-01 (in development longer than
# the project's p75 for development, with no code review recorded), on OPS.
#
# The thresholds come from every closed OPS interval that left within the 180
# days before `now` (2026-11-04T12:00Z): the cases below, flow.yaml's OPS
# cases and the `history` below. tests/labels/findings.yaml works each p90 and
# the p75 out by hand. In-flight ages are hours from entering the current
# status to `now`.
#
# Format: see estimates.yaml. `history` is closed work written compactly, one
# issue per line: path = [status, hours in it, next status, ..., final status].
# The loader makes each step a status change that many hours after the last,
# so the hours in a path are exactly its closed intervals' hours.

defaults: {issue_type: Task, assignee_id: acc-team-1, original_estimate_s: 28800}

cases:
  - about: "In To Do for 200 h, never touched"
    issue: {issue_key: OPS-501, status: To Do, created_at: "2026-10-27T04:00:00.000Z"}

  - about: "In Progress for 100 h, never reviewed"
    issue: {issue_key: OPS-502, status: In Progress, created_at: "2026-10-31T07:00:00.000Z"}
    status_changes:
      - {changelog_id: "35021", changed_at: "2026-10-31T08:00:00.000Z", from_status: To Do, to_status: In Progress}

  - about: "Reviewed, then in QA for 100 h"
    issue: {issue_key: OPS-503, status: QA, created_at: "2026-10-30T20:00:00.000Z"}
    status_changes:
      - {changelog_id: "35031", changed_at: "2026-10-30T21:00:00.000Z", from_status: To Do, to_status: In Progress}
      - {changelog_id: "35032", changed_at: "2026-10-31T04:00:00.000Z", from_status: In Progress, to_status: In Review}
      - {changelog_id: "35033", changed_at: "2026-10-31T08:00:00.000Z", from_status: In Review, to_status: QA}

  - about: "In Review for 3 h"
    issue: {issue_key: OPS-504, status: In Review, created_at: "2026-11-04T00:00:00.000Z"}
    status_changes:
      - {changelog_id: "35041", changed_at: "2026-11-04T01:00:00.000Z", from_status: To Do, to_status: In Progress}
      - {changelog_id: "35042", changed_at: "2026-11-04T09:00:00.000Z", from_status: In Progress, to_status: In Review}

  - about: "In Progress for 2 h"
    issue: {issue_key: OPS-505, status: In Progress, created_at: "2026-11-04T09:00:00.000Z"}
    status_changes:
      - {changelog_id: "35051", changed_at: "2026-11-04T10:00:00.000Z", from_status: To Do, to_status: In Progress}

  - about: "Created an hour ago, in To Do"
    issue: {issue_key: OPS-506, status: To Do, created_at: "2026-11-04T11:00:00.000Z"}

  - about: "In Progress for 40 h, never reviewed: past the p75, not the p90"
    issue: {issue_key: OPS-507, status: In Progress, created_at: "2026-11-02T19:00:00.000Z"}
    status_changes:
      - {changelog_id: "35071", changed_at: "2026-11-02T20:00:00.000Z", from_status: To Do, to_status: In Progress}

  - about: "Created straight into In Progress 35 h ago, never reviewed: exactly the p75"
    issue: {issue_key: OPS-508, status: In Progress, created_at: "2026-11-03T01:00:00.000Z"}

  - about: "Sent back from In Review 40 h ago: in development, but reviewed"
    issue: {issue_key: OPS-509, status: In Progress, created_at: "2026-11-02T08:00:00.000Z"}
    status_changes:
      - {changelog_id: "35091", changed_at: "2026-11-02T09:00:00.000Z", from_status: To Do, to_status: In Progress}
      - {changelog_id: "35092", changed_at: "2026-11-02T13:00:00.000Z", from_status: In Progress, to_status: In Review}
      - {changelog_id: "35093", changed_at: "2026-11-02T20:00:00.000Z", from_status: In Review, to_status: In Progress}

  - about: "In Progress for 42.9 h (42 h 54 min), never reviewed: just over the p90"
    issue: {issue_key: OPS-510, status: In Progress, created_at: "2026-11-02T16:06:00.000Z"}
    status_changes:
      - {changelog_id: "35101", changed_at: "2026-11-02T17:06:00.000Z", from_status: To Do, to_status: In Progress}

  - about: "In Progress for 42.7 h (42 h 42 min), never reviewed: just under the p90"
