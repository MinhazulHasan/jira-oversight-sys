# Expected rule findings for the fixtures in tests/fixtures/rules/, worked out by
# hand from config/rules.yaml (never by running the engine). Checked by
# tests/test_rules_labels.py, which runs derive and the rules at `now` and wants
# exactly these findings: no extras, no misses.
#
# Per project:
# - not_measurable: rule -> the evidence or stages it lacks there (rule_status
#   measurable 0, missing_json). Every other rule must be measurable.
# - notes: rule -> text its rule_status note must contain (null: no note).
# - findings: every finding, as (rule_id, issue_key, evidence_key, severity);
#   `evidence` (optional) lists evidence values that must match too.
# - negatives: rule -> cases it checks and must stay silent on (each rule needs
#   at least 3 positive and 3 negative cases over all projects).
#
# Times below are UTC; "h" means calendar hours, as everywhere in Phase 2.

now: "2026-11-04T12:00:00.000Z"

projects:
  AIL:
    # Every evidence name is null in AIL, and no status maps to testing.
    not_measurable:
      R-FLOW-01: [code_review, testing]
      W-REV-01: [code_review]
