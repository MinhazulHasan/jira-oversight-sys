      - {rule_id: R-FLOW-02, issue_key: AIL-302, evidence_key: skip-13021, severity: breach}
      - {rule_id: R-FLOW-02, issue_key: AIL-302, evidence_key: skip-13023, severity: breach}
      - {rule_id: R-FLOW-03, issue_key: AIL-302, evidence_key: reopen-13022, severity: warning}
      # AIL-305: 13053 Done -> In Progress and 13055 Done -> To Do: two reopens.
      - {rule_id: R-FLOW-03, issue_key: AIL-305, evidence_key: reopen-13053, severity: warning}
      - {rule_id: R-FLOW-03, issue_key: AIL-305, evidence_key: reopen-13055, severity: warning}
      # AIL-306: 13063 Done -> In Progress (still in progress: the rule has no
      # applies_to, so any category counts).
      - {rule_id: R-FLOW-03, issue_key: AIL-306, evidence_key: reopen-13063, severity: warning}
    negatives:
      # AIL-303 moves one stage at a time; AIL-304's In Progress -> To Do and
      # AIL-305's reopens move backwards; AIL-105 has no status history.
      R-FLOW-02: [AIL-303, AIL-304, AIL-305, AIL-105]
