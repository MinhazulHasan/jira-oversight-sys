      - {rule_id: W-EST-01, issue_key: AIL-606, evidence_key: unestimated-sprint-702, severity: warning}
      # AIL-606 also started (11-04 09:00) with no points.
      - {rule_id: R-EST-01, issue_key: AIL-606, evidence_key: no-estimate, severity: breach}
      # Sprint 7 (701): ends 11-05 12:00, 24 h / 24 = 1.0 day left <= 2. Members
