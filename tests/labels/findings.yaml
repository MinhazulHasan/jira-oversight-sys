      - {rule_id: W-EFF-01, issue_key: AIL-204, evidence_key: ratio-ge-0.8, severity: warning}
      # AIL-206: in progress, 115200 s = 32 h on 5 points = 40 h: 0.8, and 0.8 >= 0.8.
      - {rule_id: W-EFF-01, issue_key: AIL-206, evidence_key: ratio-ge-0.8, severity: warning,
