      - {rule_id: R-EST-02, issue_key: AIL-106, evidence_key: estimate-after-start, severity: warning}
      # AIL-107: started 11-03 09:00, points set 10:30: 1.5 h > 1 h (still in progress).
      - {rule_id: R-EST-02, issue_key: AIL-107, evidence_key: estimate-after-start, severity: warning}

      # --- effort.yaml (estimate = points x 8 h) ---------------------------------------
      # AIL-201: 86400 s = 24 h on 2 points = 16 h: 24 / 16 = 1.5, and 1.5 >= 1.5.
      - {rule_id: R-EFF-01, issue_key: AIL-201, evidence_key: ratio-ge-1.5, severity: breach,
         evidence: {effort_ratio: 1.5, estimate_h: 16.0, time_spent_h: 24.0}}
      # AIL-202: 144000 s = 40 h on 1 point = 8 h: 5.0.
      - {rule_id: R-EFF-01, issue_key: AIL-202, evidence_key: ratio-ge-1.5, severity: breach}
      # AIL-205: started 04-27 10:00 with no points (and so no ratio).
      - {rule_id: R-EST-01, issue_key: AIL-205, evidence_key: no-estimate, severity: breach}
