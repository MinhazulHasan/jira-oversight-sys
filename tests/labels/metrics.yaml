      # created 10-01 09:00 -> change 1011 at 10-01 10:00 = 1 h
      - {status: To Do, stage: backlog, entered_at: "2026-10-01T09:00:00.000Z", left_at: "2026-10-01T10:00:00.000Z", hours: 1.0}
      # 10-01 10:00 -> change 1012 at 10-03 16:00 = 2 days (48 h) + 6 h = 54 h
      - {status: In Progress, stage: development, entered_at: "2026-10-01T10:00:00.000Z", left_at: "2026-10-03T16:00:00.000Z", hours: 54.0}
      - {status: Done, stage: done, entered_at: "2026-10-03T16:00:00.000Z", left_at: null, hours: null}
    metrics:
      started_at: "2026-10-01T10:00:00.000Z"        # entry into In Progress (development)
      done_at: "2026-10-03T16:00:00.000Z"           # entry into the final Done
      cycle_time_h: 54.0                            # 10-01 10:00 -> 10-03 16:00, as above
      reopen_count: 0
      skipped_stages: []                            # backlog -> development -> done, one step at a time
      estimate_basis: points
      estimate_set_at: "2026-10-01T09:30:00.000Z"   # change 1010: null -> "2" (from had no estimate)
      effort_ratio: 1.25                            # 72000 s / 3600 = 20 h; 2 x 8 = 16 h; 20 / 16
      status_age_h: 764.0                           # 10-03 16:00 -> 11-04 12:00: (35 - 3) x 24 = 768, - 4 h

