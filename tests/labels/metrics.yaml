# Expected status intervals and issue metrics for the hand-built fixtures in
# tests/fixtures/derive/ (tickets 5 and 6). Every value was worked out by hand
# from the fixture rows, with the arithmetic in the comments. Never regenerate
# this file by running the code: a label that disagrees with the code is a
# finding to explain, not a number to overwrite.
#
# Conventions
# - Calendar hours (Planning.md Phase 2 step 5). Times are UTC; "10-03 16:00"
#   means 2026-10-03T16:00:00.000Z.
# - status_age_h runs from the last interval's entered_at to `now`. From day D
#   of October to 4 November is (35 - D) days, because October has 31 days:
#   (31 - D) days to 31 Oct, plus 4.
# - effort_ratio = (time_spent_s / 3600) / estimate hours, where estimate hours
#   = story_points x 8 for AIL (points basis) and original_estimate_s / 3600
#   for OPS (hours basis).
# - started_at is the first entry into a work stage (development up to, not
#   including, done). done_at is the start of the trailing run of done
#   intervals, when the last interval is done.
# - `warnings` (TimelineWarnings) is zero for both counters unless a case says
#   otherwise. Every metric row also has computed_at == now.

now: "2026-11-04T12:00:00.000Z"

# What run_derive reports over all 21 cases (AIL and OPS).
run:
  issues: {AIL: 18, OPS: 3}
  # AIL: 3+1+2+5+3+3+3+3+3+2+3+4+3+3+4+1+5+3 = 54 (101..117, then 1140);
  # OPS: 4+2+8 = 14; 54 + 14 = 68.
  intervals: 68
  warnings:
    inconsistent_transitions: 1   # AIL-112, change 1122
    negative_intervals: 1         # AIL-113, change 1131
    unmapped_statuses: 2          # AIL: In Review (AIL-111) and Closed (AIL-115); OPS maps all of its own
    current_status_mismatch: 0    # every history ends in its issue's current status
    missing_created_at: 0

